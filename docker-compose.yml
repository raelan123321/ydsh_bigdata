services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
  hive-metastore:
    image: apache/hive:3.1.3
    depends_on:
      - mysql
    environment:
      SERVICE_NAME: metastore
    ports:
      - "9083:9083"
  hive-server:
    image: apache/hive:3.1.3
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
volumes:
  mysql-data:

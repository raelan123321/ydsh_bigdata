services:
  # ---------- 基础设施：MySQL（metastore 元数据库 + ADS 结果库） ----------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: metastore_db
      MYSQL_USER: hive
      MYSQL_PASSWORD: ${HIVE_DB_PASSWORD:-hive}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- Hive 数据仓库 ----------
  hive-metastore:
    image: w4-hive
    build: ./hive
    user: "0:0"
    # 已停用（加 profiles 后仅显式 `--profile` 才会启动）：Derby 独占锁与广播主机名问题，
    # 元数据改为 hive-server 内嵌 Derby + 命名卷持久化
    profiles: ["legacy-metastore"]
    # 指定合法主机名：默认容器主机名含下划线，thrift 广播 URI 会因非法字符解析失败
    hostname: hive-metastore
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      HIVE_CUSTOM_CONF_DIR: /opt/hive/conf-custom
      HIVE_METASTORE_JDBC_URL: jdbc:mysql://mysql:3306/metastore_db?useSSL=false&allowPublicKeyRetrieval=true
      HIVE_METASTORE_JDBC_DRIVER: com.mysql.cj.jdbc.Driver
      HIVE_METASTORE_JDBC_USER: hive
      HIVE_METASTORE_JDBC_PASSWORD: ${HIVE_DB_PASSWORD:-hive}
    volumes:
      - ./hive/conf:/opt/hive/conf-custom:ro
      - hive_metastore:/opt/hive/metastore_db
      - hive_warehouse:/opt/hive/data/warehouse
      - hive_warehouse_legacy:/opt/hive/warehouse
    ports:
      - "9083:9083"

  # 嵌入式 Derby 元数据存于 hive-server（挂 hive_metastore 命名卷持久化）。
  # 不再单独起 hive-metastore 服务：Derby 同库不允许多进程并发写；且远程 metastore
  # 广播主机名含下划线会被 Java URI 拒绝（thrift 解析报 Illegal character）。
  hive-server:
    image: w4-hive
    build: ./hive
    user: "0:0"
    environment:
      SERVICE_NAME: hiveserver2
      HIVE_CUSTOM_CONF_DIR: /opt/hive/conf-custom
    volumes:
      - ./hive/conf:/opt/hive/conf-custom:ro
      - hive_metastore:/opt/hive/metastore_db
      - hive_warehouse:/opt/hive/data/warehouse
      - hive_warehouse_legacy:/opt/hive/warehouse
      - "E:/模拟数据:/data/模拟数据:ro"
    ports:
      - "10000:10000"
      - "10002:10002"
    healthcheck:
      test: ["CMD-SHELL", "beeline -u jdbc:hive2://localhost:10000/default -n hive -e 'select 1' || exit 1"]
      interval: 30s
      timeout: 60s
      retries: 20
      start_period: 150s

  # ---------- Superset BI（自定义镜像：内置 Hive/MySQL 驱动） ----------
  superset:
    image: w4-superset
    build: ./superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-please_change_this_secret}
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_data:/app/superset.db
    depends_on:
      mysql:
        condition: service_healthy
      hive-server:
        condition: service_healthy
    ports:
      - "8088:8088"

  # ---------- ClickHouse（任务书要求编排的 OLAP 服务） ----------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://default:$${CLICKHOUSE_PASSWORD}@localhost:8123/?query=SELECT%201\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- 大屏数据 API（Flask，提供 JSON 接口 + 静态大屏页面） ----------
  screen-api:
    image: w4-app
    build: ./app
    command: ["python", "screen_api.py"]
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "8080"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./python:/opt/project/python:ro

  # ---------- Streamlit 智能问答（NL2SQL 闭环） ----------
  app:
    image: w4-app
    build: ./app
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      HIVE_HOST: hive-server
      HIVE_PORT: "10000"
      HIVE_USER: hive
      HIVE_DB: dws
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    depends_on:
      hive-server:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./python:/opt/project/python:ro
      - ./app:/opt/project/app
      - ./output:/opt/project/output:ro

volumes:
  mysql_data:
  clickhouse_data:
  superset_data:
  hive_metastore:
  hive_warehouse:
  hive_warehouse_legacy:

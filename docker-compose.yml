version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metastore_db
      MYSQL_USER: hive
      MYSQL_PASSWORD: hive
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD","mysqladmin","ping","-uroot","-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  hive-metastore:
    image: apache/hive:3.1.3
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      HIVE_METASTORE_JDBC_URL: jdbc:mysql://mysql:3306/metastore_db?useSSL=false&allowPublicKeyRetrieval=true
      HIVE_METASTORE_JDBC_DRIVER: com.mysql.cj.jdbc.Driver
      HIVE_METASTORE_JDBC_USER: hive
      HIVE_METASTORE_JDBC_PASSWORD: hive
    ports:
      - "9083:9083"

  hive-server:
    image: apache/hive:3.1.3
    depends_on:
      hive-metastore:
        condition: service_started
    environment:
      SERVICE_NAME: hiveserver2
    ports:
      - "10000:10000"
      - "10002:10002"
